services:
    app:
        container_name: apple-one-ledger
        image: ghcr.io/ec061/apple-one-ledger:latest
        restart: always
        init: true
        ports:
            - "18900:3000"
        environment:
            DATA_DIR: /data
            DATABASE_PATH: /data/applecare.db
            PORT: "3000"
            NODE_ENV: production
            SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (32+ random chars)}
            ADMIN_REG_CODE: ${ADMIN_REG_CODE:?set ADMIN_REG_CODE}
            APP_URL: ${APP_URL:-}
        volumes:
            - ./data:/data
        security_opt:
            - no-new-privileges:true
